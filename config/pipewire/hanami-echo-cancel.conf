# Hanami: a microphone with echo cancellation (WebRTC AEC), so the assistant can keep listening while it speaks and
# never hears its own voice. Monitor mode: the reference is what the default output plays (its monitor), so no audio
# is rerouted and the x1sound speaker DSP stays as it is. It captures the default input. Hanami picks
# "hanami_aec_source" on the Voice page's Devices tab. install.sh links it when Hanami is on and removes
# the link when Hanami is turned off; restart pipewire after a change.
context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            # One channel end to end: the mic is mono (a USB mic, or the UM2 in mono mode), and a stereo canceller fed
            # one channel garbles the voice. Hanami reads it as stereo and gets the same voice in both.
            audio.channels = 1
            audio.position = [ MONO ]
            node.latency = 1024/48000
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = false
                webrtc.extended_filter = true
            }
            capture.props = {
                node.name = "hanami_aec_capture"
                node.passive = true
            }
            source.props = {
                node.name = "hanami_aec_source"
                node.description = "Microphone (echo cancelled)"
            }
        }
    }
]
