# Hanami (the voice assistant, an optional component of these dots): lets it type into and read this terminal in the
# background, only through a socket in your private session folder ($XDG_RUNTIME_DIR, mode 0700).
# kitty.conf reads this file only through the hanami.conf link that install.sh creates when Hanami is picked
# (gitignored); rm ~/.config/kitty/hanami.conf turns it off. Restart kitty after either change.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
