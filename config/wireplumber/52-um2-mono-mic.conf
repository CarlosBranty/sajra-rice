# Behringer U-Phoria UM2: input 1 (the XLR/combo, where the mic goes) arrives on the left channel only and input 2 on
# the right, so a mic shows up in one ear. Open its capture in the chip's own mono mode instead: every app gets the
# mic as one channel, upmixed to both ears when it records stereo. The UM2 is a TI PCM2902 (USB 08bb:2902): this also
# matches other boxes built on that chip (Behringer UCA202/UCA222), whose stereo line input would turn mono too.
monitor.alsa.rules = [
  { matches = [ { node.name = "~alsa_input.usb-Burr-Brown_from_TI_USB_Audio_CODEC-*" } ]
    actions = { update-props = { audio.channels = 1, audio.position = [ MONO ] } } }
]
