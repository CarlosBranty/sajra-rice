# Tema minimalista estilo Pure para Starship: ruta corta, rama git, flecha morada.
add_newline = true
format = "$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
style = "bold blue"
truncation_length = 2
truncation_symbol = "…/"
read_only = " 🔒"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bright-black"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 5000
style = "yellow"
format = "[$duration]($style) "

[line_break]
disabled = false

[character]
success_symbol = "[❯](magenta)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

# Remote marker: only shown inside SSH sessions
[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
style = "bold yellow"
format = "[$ssh_symbol$hostname]($style) "
