# x1sound fase 2: volumen por software en la tarjeta interna. Los DAC hardware quedan fijos en sus techos
# (DAC1 tweeters, DAC2 woofers = balance), así el equilibrio arriba/abajo no cambia con el volumen.
monitor.alsa.rules = [
  { matches = [ { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } } }
]
